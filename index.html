<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0d13">
<title>Shlomicom · חדר בקרה</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0d13; --side:#0e121a; --surface:#121824; --card:#151c2a; --card2:#1a2233; --line:#232c3f; --line2:#2d3850;
  --text:#e8ebf2; --muted:#8b95ab; --dim:#5f6980;
  --accent:#8b6cff; --accent2:#5ad1ff; --ok:#34d399; --warn:#f5b041; --bad:#ff6b6b;
  --claude:#e08a5f; --codex:#19c39c; --agy:#5b9cff;
  --r:16px; --r2:12px; --gut:16px;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Heebo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent2)}
.hidden{display:none!important}

/* ---------- lock screen ---------- */
.lock{min-height:100dvh;display:grid;place-items:center;padding:24px var(--gut);
  background:radial-gradient(1200px 600px at 80% -10%,#2a1f5c55,transparent 60%),radial-gradient(900px 500px at 0% 110%,#0f4a5c44,transparent 60%),var(--bg)}
.lock-card{width:min(420px,100%);background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 80px #0008}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:900;font-size:22px;
  background:conic-gradient(from 200deg,var(--accent),var(--accent2),var(--accent));color:#0a0d13}
.brand h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.lock p{color:var(--muted);line-height:1.6;margin:18px 0}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.field label{font-size:13px;color:var(--muted)}
.input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:13px 14px;outline:none;transition:border .15s}
.input:focus{border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;
  background:var(--accent);color:#fff;transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.block{width:100%}
.check{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:4px 0 18px}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:10px}
.err.net{color:var(--warn,#f5b041)}
.pw{position:relative}
.pw .input{padding-inline-start:48px}
.eye{position:absolute;inset-inline-start:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;border-radius:10px;background:transparent;
  color:var(--muted);cursor:pointer;display:grid;place-items:center}
.eye:hover{color:var(--text);background:var(--surface)}
.eye svg{width:20px;height:20px}
.hint{font-size:13.5px;color:#f5b041;background:#f5b04118;border:1px solid #f5b04144;border-radius:10px;padding:8px 10px;margin-top:8px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:1fr;min-height:100dvh}
.side{display:none}
.main{min-width:0;padding:0 var(--gut) calc(88px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 12px;
  background:linear-gradient(var(--bg) 70%,transparent)}
.topbar .brand h1{font-size:17px}
.topbar .logo{width:36px;height:36px;border-radius:11px;font-size:18px}
.fresh{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:7px 12px;border-radius:999px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}
.dot.live{background:var(--ok);box-shadow:0 0 0 0 #34d39988;animation:pulse 1.8s infinite}
.dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)}
.fresh .sep{width:1px;height:14px;background:var(--line2)}
.fresh b{font-weight:600;color:var(--text)}
.avatar{position:relative}
.avatar.on::after{content:"";position:absolute;inset-inline-end:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
@keyframes flashin{from{box-shadow:0 0 0 2px #5ad1ff99;background:#16304a}to{box-shadow:none}}
.msg.new,.rc.new{animation:flashin 2.4s ease-out}
@keyframes pulse{0%{box-shadow:0 0 0 0 #34d39977}70%{box-shadow:0 0 0 9px #34d39900}100%{box-shadow:0 0 0 0 #34d39900}}

.bottomnav{position:fixed;inset:auto 0 0 0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);
  background:#0e121af2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.navbtn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:500;padding:6px 2px;border-radius:12px;cursor:pointer;position:relative}
.navbtn svg{width:22px;height:22px}
.navbtn.on{color:var(--text)} .navbtn.on svg{color:var(--accent)}
.badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;border-radius:999px;padding:0 5px;min-width:16px;text-align:center}

h2.sec{font-size:15px;font-weight:700;color:var(--muted);margin:26px 0 12px;display:flex;align-items:center;justify-content:space-between;letter-spacing:.2px}
h2.sec .more{font-size:13px;color:var(--accent2);background:none;border:0;cursor:pointer}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:899px){.kpi:not(.money){padding:12px}.kpi:not(.money) .num{font-size:30px}.kpi:not(.money) .glyph{display:none}.kpi .sub{font-size:11px}}
.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;position:relative;overflow:hidden}
.kpi .lbl{color:var(--muted);font-size:13px;font-weight:500}
.kpi .num{font-size:38px;font-weight:900;line-height:1.1;margin-top:6px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.kpi .num small{font-size:18px;color:var(--muted);font-weight:700;margin-inline-start:4px}
.kpi .sub{color:var(--dim);font-size:12px;margin-top:4px}
.kpi.money{grid-column:1/-1;background:radial-gradient(400px 160px at 10% 0%,#8b6cff33,transparent 70%),linear-gradient(180deg,var(--card2),var(--card))}
.kpi.money .num{font-size:52px}
.kpi .glyph{position:absolute;inset-inline-end:12px;top:12px;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#ffffff0a;color:var(--muted)}
.kpi .glyph svg{width:17px;height:17px}
.ok{color:var(--ok)} .bad{color:var(--bad)} .warnc{color:var(--warn)}

/* ---------- workers ---------- */
.workers{display:grid;grid-template-columns:1fr;gap:12px}
.wcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.wcard.active{border-color:#8b6cff66;box-shadow:0 0 0 1px #8b6cff22,0 12px 40px #0006;background:linear-gradient(180deg,#1b1f38,var(--card) 60%)}
.whead{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;color:#0a0d13}
.wname{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.wrole{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wmeta{flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:#ffffff0d;color:var(--muted);white-space:nowrap}
.chip.on{background:#34d3991f;color:var(--ok)} .chip.ext{background:#5ad1ff1a;color:var(--accent2)}
.chip.fail{background:#ff6b6b1f;color:var(--bad)}
.wrow{display:flex;flex-wrap:wrap;gap:6px}
.now{background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.now .k{color:var(--dim);font-size:12px;display:block;margin-bottom:2px}
.term{background:#070a0f;border:1px solid var(--line);border-radius:var(--r2);padding:10px 12px;font-family:var(--mono);font-size:11.5px;line-height:1.65;color:#aeb8cc;
  max-height:230px;overflow:auto;direction:ltr;text-align:left}
.term div{white-space:pre-wrap;overflow-wrap:anywhere;unicode-bidi:plaintext}
.term .t{color:var(--dim)} .term .w{color:#e8ebf2} .term .tool{color:#c9b6ff} .term .res{color:#6f7a90} .term .x{color:var(--bad)} .term .fin{color:var(--ok)}
details.logd summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;display:flex;align-items:center;gap:6px}
details.logd summary::-webkit-details-marker{display:none}
details.logd[open] summary{margin-bottom:8px}
.idle-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.idle{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 10px;min-width:0}
.idle .avatar{width:32px;height:32px;border-radius:10px;font-size:15px;opacity:.9}
.idle b{font-size:14px;display:block} .idle span{font-size:12px;color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- CEO + queue + engines ---------- */
.ceo{background:radial-gradient(420px 140px at 90% 0%,#34d39922,transparent 70%),linear-gradient(180deg,var(--card2),var(--card));border:1px solid #34d39955;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ceo.off{border-color:#ff6b6b55;background:linear-gradient(180deg,#2a1717,var(--card))}
.ceo .evs{display:flex;flex-wrap:wrap;gap:6px}
.ops{display:grid;grid-template-columns:1fr;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.panel h3{margin:0;font-size:14px;color:var(--muted);font-weight:700}
.qrow{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r2);padding:8px 10px;min-width:0}
.qrow .avatar{width:30px;height:30px;border-radius:9px;font-size:14px}
.qrow .qm{flex:1;min-width:0;font-size:13px}.qrow .qm b{display:block;font-size:14px}
.qrow .qm span{color:var(--dim);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eng{display:flex;align-items:center;gap:8px;font-size:14px;padding:8px 10px;border-radius:var(--r2);background:#ff6b6b14;border:1px solid #ff6b6b44;color:#ffc9c9;overflow-wrap:anywhere}
.eng.okk{background:#34d39912;border-color:#34d39933;color:var(--ok)}
.chip.on .dot.live{background:var(--ok)}
@media (min-width:900px){ .ops{grid-template-columns:1fr 1fr} }

/* ---------- feeds ---------- */
.feed{display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;min-width:0}
.msg .avatar{width:34px;height:34px;border-radius:11px;font-size:15px}
.msg .body{flex:1;min-width:0}
.msg .hdr{display:flex;align-items:baseline;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.msg .hdr b{color:var(--text);font-size:14px}
.msg .hdr time{margin-inline-start:auto;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.msg .txt{margin-top:3px;font-size:14.5px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}
.msg .txt.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.msg.chair{border-color:#f5b04155;background:linear-gradient(180deg,#2a2213,var(--card) 70%)}
.msg.sys .txt{color:#b9c1d3}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.tab{background:var(--surface);border:1px solid var(--line);color:var(--muted);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{color:var(--dim);text-align:center;padding:28px 10px;background:var(--card);border:1px dashed var(--line2);border-radius:var(--r)}

/* ---------- receipts ---------- */
.rc{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.pill{font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px}
.pill.pass{background:#34d39922;color:var(--ok)} .pill.fail{background:#ff6b6b22;color:var(--bad)}
.rc .who{font-weight:700;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc time{color:var(--dim);font-size:12px}
.rc .cmd{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;color:var(--muted);direction:ltr;text-align:left;overflow-wrap:anywhere;background:#070a0f;border-radius:8px;padding:6px 8px}
.rc .why{grid-column:1/-1;color:var(--bad);font-size:13px}

/* ---------- compose ---------- */
.compose{background:linear-gradient(180deg,#221d10,var(--card));border:1px solid #f5b04144;border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.compose textarea{min-height:90px;resize:vertical}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .input{flex:1;min-width:140px}
.note{color:var(--muted);font-size:13px;line-height:1.6}
/* ---------- gallery ---------- */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,46%);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none}
.strip .shot{scroll-snap-align:start}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.shot{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;min-width:0;padding:0;text-align:start;color:inherit}
.shot:hover{border-color:var(--line2)}
.shot .ph{position:relative;aspect-ratio:16/10;background:linear-gradient(110deg,#121824 30%,#1a2233 50%,#121824 70%) 0 0/300% 100%;animation:shimmer 1.4s linear infinite}
.shot .ph.done{animation:none;background:#070a0f}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}
.shot img.on{opacity:1}
.shot .play{position:absolute;inset-inline-start:8px;bottom:8px;background:#000b;color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px}
.shot .cap{padding:8px 10px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.shot .cap b{font-size:13.5px;font-weight:700;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shot .cap span{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes shimmer{to{background-position:-300% 0}}
.held{display:flex;flex-direction:column;gap:6px}
.held div{background:var(--card);border:1px dashed #f5b04166;border-radius:12px;padding:9px 12px;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.held b{color:var(--text);font-weight:600;direction:ltr;unicode-bidi:plaintext}
.lb{position:fixed;inset:0;z-index:30;background:#05070bf2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lb img{max-width:100%;max-height:calc(100dvh - 140px);border-radius:10px;box-shadow:0 20px 60px #000}
.lb .meta{color:var(--muted);font-size:14px;text-align:center;line-height:1.6;max-width:720px}
.lb .meta b{color:var(--text);direction:ltr;unicode-bidi:plaintext}
.lb .x{position:absolute;top:calc(12px + env(safe-area-inset-top));inset-inline-end:12px;width:44px;height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:22px;cursor:pointer}
@media (min-width:900px){ .strip{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);grid-auto-columns:auto;overflow:visible} .gal{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))} }
.toast{position:fixed;inset-inline:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:20;background:var(--card2);border:1px solid var(--line2);border-radius:14px;padding:12px 14px;box-shadow:0 20px 50px #000a;font-size:14px}

/* ---------- desktop ---------- */
@media (min-width:900px){
  :root{--gut:28px}
  .app{grid-template-columns:260px 1fr}
  .side{display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100dvh;background:var(--side);border-inline-end:1px solid var(--line);padding:22px 16px;overflow:auto}
  .side nav{display:flex;flex-direction:column;gap:4px}
  .side .navbtn{flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;padding:11px 12px;color:var(--muted)}
  .side .navbtn.on{background:#8b6cff1f;color:var(--text)}
  .side .badge{position:static;margin-inline-start:auto}
  .side .mini{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
  .side .mini .lbl{color:var(--muted);font-size:12px}
  .side .mini .big{font-size:30px;font-weight:900}
  .side .foot{margin-top:auto;color:var(--dim);font-size:12px;display:flex;flex-direction:column;gap:8px}
  .bottomnav{display:none}
  .main{padding-bottom:40px}
  .topbar .brand{visibility:hidden}
  .kpis{grid-template-columns:1.4fr 1fr 1fr 1fr}
  .kpi.money{grid-column:auto}
  .workers{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
  .cols{display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:start}
  .toast{inset-inline:auto 24px;bottom:24px;max-width:380px}
}
@media (min-width:1500px){ .workers{grid-template-columns:repeat(3,1fr)} }
</style>
</head>
<body>

<!-- lock -->
<section id="lock" class="lock hidden">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <div class="brand"><div class="logo">S</div><div><h1>Shlomicom</h1><small>חדר הבקרה של היו"ר</small></div></div>
    <p>הנתונים מוצפנים. מקלידים את מילת הסיסמה פעם אחת, והיא נשמרת רק במכשיר הזה. היא לא נשלחת לשום מקום — הפענוח קורה כאן בדפדפן.</p>
    <div class="field"><label for="pass">מילת סיסמה לחדר הבקרה</label>
      <div class="pw"><input class="input" id="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" dir="ltr" required>
        <button class="eye" id="eye" type="button" aria-label="הצג סיסמה" aria-pressed="false"></button></div>
      <div class="hint hidden" id="hebHint" role="alert">נראה שהמקלדת בעברית — החלף לאנגלית</div></div>
    <label class="check"><input type="checkbox" id="remember" checked> לזכור במכשיר הזה</label>
    <button class="btn block" type="submit">כניסה</button>
    <div class="err" id="lockErr"></div>
  </form>
</section>

<!-- app -->
<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand"><div class="logo">S</div><div><h1>Shlomicom</h1><small>חדר בקרה</small></div></div>
    <nav id="sideNav"></nav>
    <div class="mini"><div class="lbl">הכנסות</div><div class="big" id="sideMoney">₪0</div></div>
    <div class="mini"><div class="lbl">עובדים פעילים</div><div class="big" id="sideActive">0/3</div></div>
    <div class="foot">
      <span id="sideHost"></span>

/* ================= crypto (WebCrypto) ================= */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const ub64 = u => btoa(String.fromCharCode(...u));
const keyCache = new Map();
async function deriveKey(pass, saltB64, iter){
  const id = pass + "\u0000" + saltB64 + ":" + iter; // must include pass: keying on salt alone made one wrong try poison every later (correct) try

}
async function decryptEnv(env, pass){
  if (env.v !== 1 || env.alg !== "AES-256-GCM" || !(env.iter >= 200000)) throw new Error("פורמט לא מוכר");

  try{ pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(env.iv)}, key, b64(env.ct)); }
  catch(e){ keyCache.clear(); throw e; } // don't keep keys derived from wrong passphrases around

}

  return {v:1, alg:"AES-256-GCM", kdf:"PBKDF2-SHA256", iter, salt:sb, iv:ub64(iv), ct:ub64(ct)};
}

/* ================= fetch ================= */
async function fetchEnvelope(){
  const t = Date.now();

    const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/data.enc.json?ref=data&t=${t}`,
      {headers:{Accept:"application/vnd.github.raw+json", Authorization:`Bearer ${token}`}, cache:"no-store"});
    if (r.ok) return r.json();
  }
  if (onPages && t - (fetchEnvelope._api || 0) > 75000 && t > (fetchEnvelope._apiBlock || 0)){ // 60 req/h/IP without a token
    fetchEnvelope._api = t;
    try{
      const r = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/data.enc.json?ref=data`,
        {headers:{Accept:"application/vnd.github.raw+json"}, cache:"no-store"});
      if (r.ok) return r.json();

  const r = await fetch(url, {cache:"no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function decryptBytes(env, pass){
  if (env.v !== 1 || env.alg !== "AES-256-GCM" || !(env.iter >= 200000)) throw new Error("פורמט לא מוכר");

}

async function refresh(){

/* ================= live channel (ntfy.sh, ciphertext only) ================= */
// Topic = "hq" + hex(HKDF(PBKDF2(pass, fixed salt, 250k), info "shlomicom-live-topic"))[:16 bytes] — derived here,
// never shipped in the site or the repo. Messages: same AES-GCM envelope as the snapshot, sess/seq/sent inside.
const LIVE = {es:null, topic:null, topicFor:null, state:"off", lastEvt:0, lastSent:0, backoff:1000, timer:null,
  seqs:{}, items:{corridor:[], chairman:[], private:{}, receipts:[]}, workers:{}, writing:{}, fresh:new Set(), got:[]};
async function liveTopic(pass){
  if (LIVE.topicFor === pass && LIVE.topic) return LIVE.topic;
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveBits"]);
  const master = await crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:enc.encode("shlomicom-hq-live-topic-v1"), iterations:250000}, base, 256);
  const hk = await crypto.subtle.importKey("raw", master, "HKDF", false, ["deriveBits"]);

  return LIVE.topic;
}
function liveClose(){ clearTimeout(LIVE.timer); if (LIVE.es){ LIVE.es.close(); LIVE.es = null; } }
async function liveConnect(){
  if (!PASS || !DATA?.live?.enabled){ if (LIVE.state !== "off"){ liveClose(); LIVE.state = "off"; paintFresh(); } return; }
  if (LIVE.es) return;
  const topic = await liveTopic(PASS);
  if (LIVE.es || !PASS) return;
  const server = (DATA.live.server || "https://ntfy.sh").replace(/\/$/, "");
  LIVE.state = "connecting"; paintFresh();
  const es = LIVE.es = new EventSource(`${server}/${topic}/sse`);
  const seen = () => { LIVE.lastEvt = Date.now(); if (LIVE.state !== "on"){ LIVE.state = "on"; LIVE.backoff = 1000; paintFresh(); } };

}, 5000);
async function liveMessage(raw){

  for (const [s, w] of Object.entries(m.workers || {})) LIVE.workers[s] = {...w, _at:m.sent};
  for (const [s, line] of Object.entries(m.writing || {})) LIVE.writing[s] = {line, _at:m.sent};

}
const itemKey = x => x.file || `${x.ts}|${x.from}|${x.to}|${(x.text || "").slice(0, 40)}`;
function mergeInto(list, extra){
  const have = new Set(list.map(itemKey));
  for (const x of extra){ if (!have.has(itemKey(x))){ const {_at, ...y} = x; list.push(y); have.add(itemKey(x)); } }
  return list.sort((a, b) => tsOf(a.ts) - tsOf(b.ts));
}
function applyLive(){ // live items stay until the (slower) GitHub snapshot has them too; then the snapshot wins
  if (!DATA) return;

  mergeInto(DATA.corridor, LIVE.items.corridor); mergeInto(DATA.chairman, LIVE.items.chairman); mergeInto(DATA.receipts, LIVE.items.receipts);

  if (p.length > 1 && /^(["']).*\1$/.test(p)) p = p.slice(1, -1);
